name: MZWEBSITE

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durasi penggunaan'
        required: false
        default: '5h40m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h40m'

jobs:
  SETUP:
    runs-on: windows-2019
    timeout-minutes: 340

    steps:
    - name: MULAI
      run: |
        Write-Host ""
        Write-Host "MZWEBSITE" -ForegroundColor Yellow
        Write-Host "Durasi : ${{ github.event.inputs.duration }}" -ForegroundColor Cyan
        Write-Host "Proses dimulai..."
        Start-Sleep 2
        Write-Host "Sistem siap." -ForegroundColor Green

    - name: KONFIGURASI
      run: |
        Write-Host "Menyiapkan layanan RDP..."

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name fDenyTSConnections `
          -Value 0 -Force

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
          -Name UserAuthentication `
          -Value 0 -Force

        netsh advfirewall firewall add rule name="MZWEBSITE-IN" dir=in action=allow protocol=TCP localport=3389
        netsh advfirewall firewall add rule name="MZWEBSITE-OUT" dir=out action=allow protocol=TCP localport=3389

        Start-Service TermService
        Write-Host "Konfigurasi selesai." -ForegroundColor Green

    - name: BUAT AKUN
      run: |
        $username = "MZWEBSITE"
        $password = "akun#123"

        Write-Host "Menyiapkan akun..."

        Remove-LocalUser -Name $username -ErrorAction SilentlyContinue

        $securePass = ConvertTo-SecureString $password -AsPlainText -Force

        New-LocalUser `
          -Name $username `
          -Password $securePass `
          -AccountNeverExpires `
          -Description "MZWEBSITE Account"

        Set-LocalUser -Name $username -PasswordNeverExpires $true

        Add-LocalGroupMember Administrators $username
        Add-LocalGroupMember "Remote Desktop Users" $username

        Enable-LocalUser $username

        echo "USER_NAME=$username" >> $env:GITHUB_ENV
        echo "USER_PASS=$password" >> $env:GITHUB_ENV
        echo $password > $env:TEMP\user_pass.txt

        Write-Host "Akun siap." -ForegroundColor Green

    - name: JARINGAN - HEADSCALE
      env:
        HEADSCALE_AUTH_KEY: ${{ secrets.HEADSCALE_AUTH_KEY }}
        HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
      run: |
        Write-Host "Menyiapkan jaringan via Headscale (self-hosted)..."

        # Download Tailscale versi terbaru (compatible dengan Headscale)
        $tailscaleVersion = "1.80.3"
        $msi = "$env:TEMP\tailscale.msi"

        Write-Host "Mengunduh Tailscale v$tailscaleVersion..."
        Invoke-WebRequest `
          "https://pkgs.tailscale.com/stable/tailscale-setup-$tailscaleVersion-amd64.msi" `
          -OutFile $msi

        Write-Host "Menginstal Tailscale..."
        Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait

        # Tunggu service siap
        Start-Sleep -Seconds 5

        # Login ke Headscale (self-hosted) bukan ke Tailscale cloud
        Write-Host "Menghubungkan ke Headscale server: $env:HEADSCALE_URL"

        & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
          --login-server=$env:HEADSCALE_URL `
          --authkey=$env:HEADSCALE_AUTH_KEY `
          --hostname=mzwebsite-$env:GITHUB_RUN_ID `
          --accept-dns `
          --accept-routes `
          --reset

        # Tunggu koneksi stabil
        Start-Sleep -Seconds 8

        # Ambil IP dari Headscale network
        $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
        echo "ADDRESS=$ip" >> $env:GITHUB_ENV

        # Verifikasi status koneksi
        $status = & "$env:ProgramFiles\Tailscale\tailscale.exe" status
        Write-Host "Status Tailscale:"
        Write-Host $status

        Write-Host "Jaringan aktif via Headscale." -ForegroundColor Green

    - name: INFORMASI
      run: |
        $pass = Get-Content $env:TEMP\user_pass.txt
        $duration = "${{ github.event.inputs.duration }}"

        switch ($duration) {
          "1h"    { $totalMinutes = 60 }
          "3h"    { $totalMinutes = 180 }
          "5h40m" { $totalMinutes = 340 }
        }

        echo "TOTAL_MINUTES=$totalMinutes" >> $env:GITHUB_ENV

        Write-Host ""
        Write-Host "===== INFORMASI AKSES =====" -ForegroundColor Yellow
        Write-Host "Headscale IP : $env:ADDRESS"
        Write-Host "User         : MZWEBSITE"
        Write-Host "Sandi        : $pass"
        Write-Host "Durasi       : $duration"
        Write-Host "===========================" -ForegroundColor Yellow

    - name: JALANKAN SESI
      run: |
        $totalMinutes = [int]$env:TOTAL_MINUTES
        $endTime = (Get-Date).AddMinutes($totalMinutes)

        Write-Host "Sesi aktif. Pembaruan setiap 5 menit."

        while ((Get-Date) -lt $endTime) {
          $now = Get-Date
          $remain = $endTime - $now

          # Cek status koneksi Headscale setiap iterasi
          $tsStatus = & "$env:ProgramFiles\Tailscale\tailscale.exe" status --json 2>$null
          
          Write-Host ("[{0}] Sisa: {1} jam {2} menit | IP: {3}" -f `
            $now.ToString("HH:mm:ss"),
            [math]::Floor($remain.TotalHours),
            $remain.Minutes,
            $env:ADDRESS)

          Start-Sleep -Seconds 300
        }

        Write-Host "Durasi selesai." -ForegroundColor Red

    - name: BERSIHKAN
      if: always()
      run: |
        Write-Host "Membersihkan sistem..."

        # Disconnect dari Headscale
        & "$env:ProgramFiles\Tailscale\tailscale.exe" logout -ErrorAction SilentlyContinue
        & "$env:ProgramFiles\Tailscale\tailscale.exe" down -ErrorAction SilentlyContinue

        Disable-LocalUser MZWEBSITE -ErrorAction SilentlyContinue
        Remove-Item "$env:TEMP\user_pass.txt" -ErrorAction SilentlyContinue

        netsh advfirewall firewall delete rule name="MZWEBSITE-IN" dir=in
        netsh advfirewall firewall delete rule name="MZWEBSITE-OUT" dir=out

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name fDenyTSConnections `
          -Value 1 -Force

        Write-Host "Selesai." -ForegroundColor Green
